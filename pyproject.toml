[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not gemini'"
markers = [
    "integration: testes que precisam do Postgres real (docker compose up db)",
    "gemini: testes que chamam o Gemini real (make test-gemini; requer GEMINI_API_KEY)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
